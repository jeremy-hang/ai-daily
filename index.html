利好国内供应链；联想液冷机架产能超1.1万个且是唯一与三大存储原厂签长协的厂商，交付能力成为份额护城河", "action": "对标联想'长协锁量'策略，提醒重点客户在存储涨价周期内尽早锁定配置与价格"}, "url": "https://finance.sina.cn/2026-09-03/detail-iniqpqxy2133777.d.html"}, {"id": "sSEP07", "date": "2026-09-03", "level": "MED", "vendor": "inspur", "cat": "server", "title": "浪潮CPU原生液冷整机柜落地：单柜384颗CPU支撑4万Agent并发，行业液冷供给告急", "source": "今日头条/Mr.D产业研究", "time": "2026-09-03", "summary": "产业盘点显示：浪潮推出CPU原生液冷整机柜服务器（单柜集成384颗CPU、支持4万以上Agent高并发）与面向多模融合场景的开放超节点AI服务器；半年报归母净利29.52亿元+269.59%。行业侧，山东、广东液冷产线持续满产，CDU核心部件订单排到年末、部分型号交付顺延至次年，高品质液冷机柜报价回升至前期高点。", "analysis": {"facts": ["浪潮CPU原生液冷整机柜单柜384颗CPU、4万+Agent并发", "CDU订单排到年末、部分交付顺延至次年", "液冷机柜报价回升至前期高点"], "significance": "液冷从'加分项'变为算力基建'必选项'，供给紧张开始出现", "impact": "元脑智算算力仓已在京津冀/西南/西北落地（CQC A级认证），西北智算项目液冷配套需求进入兑现期", "action": "向西北有智算意向的客户主动推介算力仓+液冷一体化方案，抢占早期项目窗口"}, "url": "https://www.toutiao.com/article/7681223096581325321/"}, {"id": "sSEP08", "date": "2026-09-02", "level": "MED", "vendor": "sugon", "cat": "server", "title": "中科曙光电话会：单柜售价上亿的超节点已有订单，'只有曙光和华为能定义超节点标准'", "source": "发现报告", "time": "2026-09-02", "summary": "中科曙光9/2机构电话会披露：2025年底推出的高算力密度超节点（一拖二液冷柜结构）可提供1280节点、单柜售价上亿且已有订单；另有面向金融/运营商的行业级轻量超节点，及与海光信息合研的互联网超节点。公司称'目前只有中科曙光和华为具备定义超节点标准的能力'；互联网客户CPU采购中超节点占比约10%、普通节点50%。与海光重组暂缓但协同持续推进，高端产品由曙光主导渠道并主推海光DCU。", "analysis": {"facts": ["一拖二液冷超节点1280节点、单柜售价上亿已有订单", "互联网客户CPU采购中超节点占比约10%", "曙光+华为双寡头定义超节点标准"], "significance": "超节点标准话语权收敛为双寡头，行业级轻量超节点打开金融/运营商增量市场", "impact": "曙光/海光体系在信创与金融场景的渗透将分流部分国产化采购需求", "action": "跟踪行业级轻量超节点在金融客户的招标动态，评估对浪潮金融行业方案的竞争影响"}, "url": "https://www.fxbaogao.com/detail/5668211"}, {"id": "sSEP06", "date": "2026-09-01", "level": "MED", "vendor": "powerleader", "cat": "demand", "title": "中国移动35亿焕新集采落定：五家国产厂商入围，紫光华山供货不足份额被砍、浪潮升至45%", "source": "证券时报/信创周报", "time": "2026-09-01", "summary": "中国移动2026-2028部件焕新服务器集采中标公示：总规模23062台PC服务器约35亿元，分自主可控ARM（9939台）/自主可控X86（8103台）/混合平台（5020台）三标包，宝德、紫光华山、浪潮、软通计算机、神州鲲泰五家入围。宝德拿下标包1、3第一候选人合计预中标超12亿元，叠加呼和浩特超节点集采共斩获超17亿元。紫光华山因供货能力仅覆盖标包2约55%需求，份额由70%下调至55%，浪潮份额由30%提升至45%。慧博云通正推进收购宝德计算控制权。", "analysis": {"facts": ["宝德两大集采（焕新+超节点）合计超17亿元", "焕新集采35亿元/23062台，五家国产厂商入围", "紫光华山供货不足份额被砍至55%，浪潮30%→45%"], "significance": "万台级集采开始按实际交付能力重新分配份额，供货保障成为投标第一变量", "impact": "华为系整机厂（宝德/长江计算/华鲲振宇）持续分食运营商订单；浪潮份额上调验证其交付确定性溢价", "action": "复盘浪潮份额上调逻辑（供应链+交付能力），在西北投标文件中强化产能与交付承诺的呈现"}, "url": "https://finance.sina.com.cn/jjxw/2026-09-01/doc-iniqiaty1563640.shtml"}, {"id": "sAUG31", "date": "2026-08-30", "level": "HIGH", "vendor": "huawei", "cat": "server", "title": "华为昇腾384超节点规模商用超750套：国产超节点进入商业化元年，Atlas 950计划Q4批量上市", "source": "东吴证券", "time": "2026-08-30", "summary": "东吴证券《超节点方案重塑AI算力产业趋势》研报：华为昇腾384超节点累计规模商用落地超750套，覆盖互联网、医疗、交通、制造等行业；最新案例为韶关数据中心集群'国芯训国模'万卡集群(30套昇腾384)。Atlas 950 SuperPoD支持最高8192张昇腾卡、训练性能较Atlas 900提升约17倍(4.91M TPS)，计划2026Q4批量上市。华勤技术超节点Q3批量出货、下半年收入预计超100亿元。国产超节点形成'产品供给—公开采购—规模部署—云服务输出'完整链条。", "analysis": {"facts": ["昇腾384超节点累计规模商用超750套，韶关万卡集群部署30套", "Atlas 950支持8192张昇腾卡、训练性能+17倍，计划Q4批量上市", "华勤超节点Q3批量出货，下半年收入预计超100亿"], "significance": "国产超节点从'样机秀'迈入'规模交付+收入兑现'阶段，昇腾系是绝对主力；华为用'更大超节点+自研互联'对冲单卡制程劣势，体系化竞争力成型", "impact": "昇腾超节点的规模放量直接挤压通用服务器高端市场空间，方案型分销商需加速嵌入昇腾/超节点生态，否则将被排除在智算主赛道之外", "action": "渠道侧评估昇腾超节点在西北落地的伙伴政策与认证路径，对方案型分销商输出'超节点+行业大模型'联合方案话术"}, "url": "https://www.sgpjbg.com/labels/guochanchaojiedianshangyehuajinzhan/1/7076603.html"}, {"id": "sAUG30", "date": "2026-08-29", "level": "MED", "vendor": "powerleader", "cat": "demand", "title": "宝德+紫光华山中标中国移动部件焕新服务器集采：两包合计约25.8亿，国产整机运营商通用盘持续放量", "source": "中国移动采购与招标网", "time": "2026-08-29", "summary": "8月29日中国移动2026-2028年部件焕新服务器集中采购项目中标候选人公示：宝德计算机、紫光华山科技等中标，两包中标金额分别约13.50亿元、12.32亿元(合计约25.82亿元)。运营商'部件焕新'类通用服务器大盘国产化率持续抬升，宝德在移动体系份额进一步巩固，与超节点/AI服务器形成'通用+智算'双线供货能力。", "analysis": {"facts": ["中国移动2026-2028部件焕新服务器集采，宝德/紫光华山等中标", "两包金额约13.50亿+12.32亿，合计约25.82亿", "叠加12.9亿超节点集采，宝德本月在移动体系连下两城"], "significance": "国产整机厂商在运营商通用服务器存量替换市场话语权持续增强，宝德'通用部件焕新+AI超节点'双线中标，说明渠道型国产厂商凭借交付与备货能力正吃掉运营商大盘", "impact": "西北片区运营商项目若涉及存量服务器部件焕新/扩容，宝德是可选国产供货来源，与方案型分销商谈判时多一个议价筹码", "action": "整理宝德在移动体系的中标记录作为'国产整机获运营商认可'的案例，向对价格敏感的二级渠道型分销商展示备选供货路径"}, "url": "https://www.ggzy.gov.cn/information/deal/html/a/0067/0104/20260829/0067dfa88d92acc240b18260e3b57b6c0c07.html"}, {"id": "sAUG28", "date": "2026-08-28", "level": "HIGH", "vendor": "inspur", "cat": "capital", "title": "浪潮信息2026半年报净利暴增269.59%：营收843.79亿，AI服务器毛利率+4.41pct，经营现金流承压", "source": "证券时报", "time": "2026-08-28", "summary": "8月27日晚浪潮信息披露2026半年报：营收843.79亿元(+5.22%)，归母净利29.52亿元(+269.59%)，扣非24.19亿元(+260.08%)。Q2单季净利23.47亿元、环比近3倍，接近去年全年水平。服务器及部件收入780.62亿元占92.51%、毛利率同比+4.41pct至8.73%，存储/交换类62.76亿元(+29.76%)。元脑SD200超节点在万亿参数大模型上Token生成时间压缩至4.77ms，液冷连续多年中国第一、兆瓦级两相液冷整机柜单芯片解热超3000W。但经营现金流净流出74.93亿元(同比扩大34.39%)，应收167.73亿元、存货526.79亿元，营运资金压力凸显。", "analysis": {"facts": ["H1营收843.79亿+5.22%，净利29.52亿+269.59%，Q2单季净利23.47亿接近去年全年", "服务器及部件780.62亿占92.51%，毛利率+4.41pct至8.73%，存储交换类+29.76%", "经营现金流-74.93亿(恶化34.39%)，应收167.73亿、存货526.79亿"], "significance": "AI服务器放量+产品结构向高毛利AI机型迁移，浪潮盈利质量实质改善(扣非仍+260%)，验证'智能体产业化'主线兑现；但现金流与存货双高，说明公司正用营运资金换出货规模，扩张质量存隐忧", "impact": "半年报是浪潮价值重估的锚点：Q2利润弹性拉满、液冷+SD200超节点双引擎确立；西北片区向政企客户报价时可引用'毛利率+4.41pct、连续多年液冷第一'强化溢价说服力", "action": "渠道侧重点：①用半年报数据向地方智算中心论证浪潮财务稳健性；②警惕公司产能占用过高的后续交付节奏波动，大单排期需提前与供应链确认"}, "url": "https://www.toutiao.com/article/7679248502882402816/"}, {"id": "sAUG29", "date": "2026-08-28", "level": "HIGH", "vendor": "powerleader", "cat": "demand", "title": "中国移动12.9亿AI超节点集采落地：3840卡由长江计算/宝德/河南昆仑/华鲲振宇四家分食，超节点概念引爆", "source": "每日经济新闻", "time": "2026-08-28", "summary": "8月26日中国移动呼和浩特智算中心2026扩容工程+2026-2027年AI超节点设备补充采购评标结果公示：本轮集采规模3840卡(480套计算节点)，据测算不含税约12.9亿元，拟由武汉长江计算、宝德计算机、河南昆仑(超聚变全资子公司)、华鲲振宇四家分食。8月28日超节点概念股活跃，星网锐捷6天3板，众诚科技、卓易信息、华勤技术、锐捷网络、海光信息、工业富联等涨幅靠前。国产超节点正从样机验证走向运营商规模化集采交付。", "analysis": {"facts": ["中国移动呼和浩特智算中心扩容+AI超节点集采3840卡/480套，不含税约12.9亿", "拟中标四家：长江计算、宝德、河南昆仑(超聚变子公司)、华鲲振宇", "盘面星网锐捷6天3板，超节点概念全线激活"], "significance": "运营商首次大规模公开采购'AI超节点'设备，是国产超节点商业化元年的标志性事件——采购标的不再是传统服务器，而是昇腾系/国产芯片超节点整机，验证'以超节点弥补单卡差距'路线获通信运营商真金白银买单", "impact": "宝德、超聚变(河南昆仑)、华为系(长江计算/华鲲振宇)成为运营商超节点赛道第一梯队受益者；西北片区运营商智算项目是主战场，超节点机型将成下半年集采核心标的", "action": "渠道侧紧盯各省移动/电信智算中心扩容标：提前储备超节点方案(昇腾384/国产DCU路线)与备货能力，把握'从通用服务器向超节点升级'的切换窗口"}, "url": "https://www.toutiao.com/article/7678898134335963654/"}, {"id": "sAUG21", "date": "2026-08-22", "level": "HIGH", "vendor": "inspur", "cat": "server", "title": "浪潮信息发布800V高压直流瞬稳技术：AI超节点整机柜供电系统的关键突破", "source": "东方财富财富号", "time": "2026-08-22", "summary": "浪潮信息成功开发高压直流瞬稳技术，推出面向AI超节点整机柜800V供电的瞬稳CBU（超容备份单元）。在CPU原生液冷整机柜基础上，补齐供电系统短板——800V高压直流架构可降低线损、提升功率密度，配合超容备份单元实现毫秒级瞬态响应，支撑GW级AIDC对供电稳定性与能效的双重要求。此前浪潮已在开放计算技术大会发布CPU原生液冷整机柜（单柜384颗CPU、0.5U容纳4核），形成'散热+供电'系统级协同。", "analysis": {"facts": ["浪潮发布800V高压直流瞬稳技术，配套瞬稳CBU超容备份单元", "此前已发布CPU原生液冷整机柜：单柜384颗CPU、业界最高密度", "从'风冷加装液冷'升级为散热与计算原生协同设计"], "significance": "浪潮从'服务器组装龙头'向'Agent基础设施定义者'跃迁，供电系统是超节点落地GW级AIDC的最后一块拼图，800V高压直流是海外超节点主流技术路线，浪潮补齐后可对标NVIDIA/AMD整机柜方案", "impact": "800V供电+原生液冷是差异化卖点，浪潮在高端AI超节点整机柜的竞争力增强，对西北片区面向政企智算中心的方案型销售是有力抓手", "action": "渠道侧可重点向地方智算中心、国资算力平台客户宣讲浪潮'液冷+800V供电'整机柜方案的TCO优势，把系统级技术壁垒转化为报价溢价"}, "url": "https://caifuhao.eastmoney.com/news/20260822091238397275700"}, {"id": "sAUG24", "date": "2026-08-21", "level": "MED", "vendor": "sugon", "cat": "server", "title": "中科曙光全链路方案亮相2026科学智能大会：scaleX40超节点+高端全闪存储+400G无损网络", "source": "科技日报", "time": "2026-08-21", "summary": "中科曙光携计算、存储、网络全链路产品亮相2026科学智能大会（AI4S）。计算侧：新一代高性能通用计算平台搭载国产128核512线程CPU、单CPU达10T级FP64双精度算力；以无线缆箱式超节点scaleX40面向大模型高密度智能计算场景。存储侧：FlashNexus 9000、ParaStor F9000高端全闪系统提供千万级IOPS、百GB带宽。网络侧：scaleFabric 400G无损网络。曙光8000全国产十万卡超集群已围绕大模型、新材料、地球科学等20余领域开展近千项超智融合应用优化，并推进第二套全国产超智融合算力系统研制。", "analysis": {"facts": ["曙光发布scaleX40无线缆箱式超节点+国产128核CPU（10T级FP64）", "FlashNexus 9000/ParaStor F9000高端全闪存储千万级IOPS", "曙光8000十万卡集群完成近千项超智融合应用适配，推进第二套"], "significance": "曙光'海光芯片+整机+超节点+存储+网络'全栈能力延伸到AI4S科研算力市场，scaleX40填补国产高密度超节点空白，与浪潮超节点形成正面竞争", "impact": "曙光在国产算力（超节点+液冷+存储）的产品矩阵日趋完整，叠加海光CPU/DCU底座，政企/科研/国资智算中心的国产化订单争夺中话语权增强", "action": "关注曙光scaleX40超节点与800G/1600G网络升级（80亿募投方向）的交付与报价，浪潮在西北政企智算/科研项目中需针对海光生态的锁定效应对标竞争"}, "url": "https://www.stdaily.com/web/gdxw/2026-08/21/content_567892.html"}, {"id": "sAUG25", "date": "2026-08-21", "level": "HIGH", "vendor": "zte", "cat": "capital", "title": "中兴通讯半年报营收780亿首超诺基亚爱立信：算力业务占比35.1%、服务器存储+60%", "source": "21世纪经济报道", "time": "2026-08-21", "summary": "中兴通讯2026年半年度报告：营收780.3亿元（+9.05%）创同期新高，首次超过诺基亚、爱立信；归母净利润27.53亿元（-45.57%）。算力业务营收同比+55%，占总营收35.1%，其中服务器及存储+近60%、数据中心产品+超90%。运营商网络317.7亿（40.7%）、政企276.3亿（+43.5%）、消费者186.3亿。研发费用109.3亿，AI领域专利申请近6000件。营收增长由算力/终端/海外三大引擎驱动，对冲国内通信资本开支下降（三大运营商2026资本开支合计2596亿、同比-9%）。", "analysis": {"facts": ["中兴营收780.3亿首次超诺基亚/爱立信，算力业务占比35.1%（+55%）", "服务器及存储+近60%、数据中心产品+超90%", "国内运营商资本开支2026年合计约2596亿、同比收缩9%"], "significance": "中兴'连接+算力'双轮驱动成效显著，服务器/数据中心成为第二增长曲线，在运营商+政企算力市场的竞争力快速提升，是浪潮服务器业务的重要竞对", "impact": "中兴服务器+60%背后是运营商智算资源池+政企AI基建放量，其'端到端全栈智算+TCO最优'打法与浪潮正面交锋，尤其中移动51亿推理集采中兴已拿8.85亿", "action": "浪潮西北片区需警惕中兴在运营商/政企算力项目的低价抢单，强化'超节点+液冷+800V供电'系统级卖点与中兴'全栈TCO'策略差异化，守住政企与运营商基本盘"}, "url": "https://finance.sina.com.cn/roll/2026-08-22/doc-inipeimp6069278.shtml"}, {"id": "sAUG20", "date": "2026-08-20", "level": "HIGH", "vendor": "market", "cat": "capital", "title": "存储超级周期全面爆发：DRAM/NAND价格创新高，AI算力虹吸先进产能红利到2027", "source": "上海证券报", "time": "2026-08-20", "summary": "2026年全球存储芯片行业处于15年一遇的超级景气周期。Q2一般型DRAM合约价环比上涨58%-63%，NAND Flash合约价环比上涨70%-75%。DDR4 8Gb现货7月均价24美元，环比6月涨14.3%创2016年以来最高。美国银行将2026年全球超大云厂商资本支出预测上调至8000亿美元以上（+67%），2027年将突破1万亿美元。三大原厂把先进产能优先投向HBM，消费电子被迫节衣缩食。", "analysis": {"facts": ["Q2 DRAM合约价环比+58%-63%，NAND合约价环比+70%-75%", "DDR4 8Gb现货7月均价24美元创2016年6月以来新高，环比+14.3%", "美国银行预测2026全球云厂商capex超8000亿美元（+67%），2027突破1万亿美元"], "significance": "存储涨价直接推高服务器BOM成本，HBM缺货+通用DRAM涨价意味着浪潮信息毛利率会承受双向挤压；渠道侧客户报价必须加上存储溢价", "impact": "浪潮的大存储客户（映客/视频/推荐/广告/超算）要接受10-20%提价，西北片区要提前和客户锁定内存采购长单，避免Q4价格再涨30%", "action": "渠道层面立即通知所有西北客户：8月-10月下单锁定内存价格，11月后接单毛利率会被压缩到3-4%，涨价压力必须转嫁给客户"}, "url": "https://finance.china.com.cn/industry/20260815/6320758.shtml", "__side": "srv"}, {"id": "sAUG22", "date": "2026-08-20", "level": "HIGH", "vendor": "inspur", "cat": "capital", "title": "浪潮信息350亿算力在手订单排产至2027Q2：海外智算放量+毛利率修复至6.64%", "source": "今日头条", "time": "2026-08-20", "summary": "浪潮信息全品类算力整机在手订单突破350亿元，高端AI服务器产能排产已延伸至2027年二季度，合同负债保持高位。订单覆盖互联网大厂万卡级训练集群、三大运营商智算集采、地方国资算力平台及金融政务行业算力项目。天池液冷基地二期投产，兆瓦级两相液冷整机柜批量供货。随着高附加值AI超节点、液冷服务器出货占比提升，Q1整体毛利率回升至6.64%（去年全年水平明显修复）。海外业务覆盖中东/东南亚/拉美，预制化集装箱智算方案批量落地。", "analysis": {"facts": ["全品类算力整机在手订单350亿元，高端AI服务器排产至2027Q2", "Q1毛利率回升至6.64%，产品结构优化带动盈利质量改善", "天池液冷二期投产、兆瓦级两相液冷整机柜批量供货，海外智算项目批量落地"], "significance": "350亿订单=中长期业绩基本盘，'超节点+液冷'高附加值产品占比提升带动毛利率结构性修复，摆脱纯组装低毛利困境", "impact": "浪潮从存货红利转向产品结构升级，订单能见度到2027Q2，对渠道是涨价+锁长单的底气；但芯片供给仍制约排产节奏，大额订单分批履约", "action": "西北片区可借'350亿在手订单+排产到2027'向政企/国资客户传递供给确定性，推动客户锁定明年份额；同时预判芯片供给瓶颈，提前协同供应链备货"}, "url": "https://www.toutiao.com/article/7676128137507308076"}, {"id": "sAUG23", "date": "2026-08-19", "level": "HIGH", "vendor": "xfusion", "cat": "capital", "title": "超聚变创业板IPO申请获深交所受理拟募资80亿：液冷国内第一，净利率仍微薄", "source": "东方财富财富号", "time": "2026-08-19", "summary": "超聚变数字技术股份有限公司创业板IPO申请已被深交所受理，拟募资80亿元（近50亿投入算力基础设施和关键技术、20.3亿建智慧制造园区及研发中心、10亿补流）。公司脱胎华为X86服务器业务，2025年营收582.46亿元、服务器出货量全国第二，AI服务器收入占比超50%，FusionPoD原生液冷整机柜市场份额连续四年国内第一。《财富》中国500强首次上榜即列第285位。隐忧：2025年归母净利润仅10.3亿元，AI服务器毛利率从2024年11.93%骤降至6.55%，前五大供应商占70%采购额、前五大客户贡献55%收入。", "analysis": {"facts": ["超聚变创业板IPO获深交所受理，拟募资80亿元", "2025年营收582.46亿、服务器出货全国第二、AI服务器收入占比超50%、液冷国内第一", "归母净利仅10.3亿，AI服务器毛利率从11.93%降至6.55%，净利率微薄"], "significance": "超聚变登陆资本市场将获得80亿弹药强化液冷+算力基础设施技术壁垒，是浪潮信息在国产AI服务器/液冷赛道最直接的对标与威胁", "impact": "超聚变IPO募资补血后，液冷整机柜价格战与中标争夺会更激烈，升腾生态（河南昆仑为超聚变子公司）在中移动集采已拿8.37亿，蚕食浪潮份额", "action": "紧盯超聚变上市节奏与其在运营商/政企液冷整机柜的报价策略，浪潮西北片区需用'800V供电+原生液冷+350亿订单规模'做差异化反击，避免陷入纯价格战"}, "url": "https://caifuhao.eastmoney.com/news/20260817223529796891270"}, {"id": "sAUG26", "date": "2026-08-18", "level": "HIGH", "vendor": "huawei", "cat": "server", "title": "华为昇腾910C-384超节点8月集中落地：移动云湖北智算中心300PFLOPS、青海零碳样板", "source": "中国工业新闻网", "time": "2026-08-18", "summary": "中国移动智算中心（武汉）上架总算力2876PFLOPS，其中'昇腾910C-384超节点'由12个计算柜+4个总线柜构成，将384颗昇腾芯片整合为单一逻辑算力池，总算力300PFLOPS，是当前业界规模最大的AI超节点，支撑'九天'千亿级大模型及20余款行业大模型训练推理。同时中国电信数字青海绿色大数据中心落地西北五省首个昇腾超节点示范项目（910C 384架构、总线带宽800GB/s、通信时延200ns内），打通'绿电-算力-Token'闭环。8月昇腾384超节点项目/签约/集群落地消息扎堆。", "analysis": {"facts": ["昇腾910C-384超节点=16机柜、300PFLOPS，业界规模最大AI超节点", "移动云湖北智算中心总算力2876PFLOPS，支撑九天千亿大模型", "青海落地西北五省首个昇腾超节点示范项目，'绿电-算力-Token'闭环"], "significance": "华为昇腾超节点在运营商侧加速规模化落地，'国产芯片+超节点+软硬一体'生态对浪潮等传统服务器厂商在国产算力市场形成碾压性冲击（中移动集采昇腾占66%）", "impact": "运营商转投昇腾生态=浪潮通用/推理服务器份额被蚕食，浪潮在中移动51亿推理集采仅2.97亿垫底即为信号；但昇腾超节点高功耗（559.4kW，GB200 NVL72近4倍）也留出液冷+供电差异化空间", "action": "浪潮需清醒认识运营商国产算力已向昇腾生态倾斜，西北政企/国资项目应主打'多元异构GPU整机柜+液冷TCO'补齐昇腾之外的市场，避免在纯昇腾集采上硬拼"}, "url": "https://www.cinn.cn/2026/08-18/514xAla1.html"}, {"id": "sAUG19", "date": "2026-08-17", "level": "MED", "vendor": "inspur", "cat": "capital", "title": "浪潮信息股价突破80元高位换手，机构目标价84.96元，Q3超节点订单集中落地预期强", "source": "东方财富", "time": "2026-08-17", "summary": "8月17日浪潮信息收盘80.68元，距52周高点96.37元仍有19.5%上行空间，距机构过去90天目标均价84.96元约5%空间。半年报预告归母净利润26-31亿元（+226%-288%），Q2单季净利润19.95-24.95亿元创上市以来新高。公司478亿元存货储备成为供应链议价关键筹码，HBM缺口51%-58%环境下龙头拿能力大超中小厂商。", "analysis": {"facts": ["股价收盘80.68元，机构90日目标均价84.96元（+5%），52周区间55-98元", "Q2单季归母净利19.95-24.95亿元，环比Q1增230%-312%，创单季盈利新高", "478亿元存货储备是把供应链紧张转化为议价能力的关键筹码，HBM缺口51%-58%"], "significance": "资本市场的预期已从「业绩预告」兑现转向「Q3超节点订单集中落地」，借货能力是当前浪潮最大的护城河", "impact": "对比天风证券给联想目标价52港元（+55%空间），浪潮的空间在估值兑现后剩余有限，但西北片区仍要借业绩热度抢客", "action": "渠道报价策略上，478亿存货代表提价抗通胀能力，西北客户对涨价接受度更高；可以趁机上调AI服务器定价的同时不涨传统通用服务器，维持份额"}, "url": "https://www.toutiao.com/article/7674917005006422551/", "__side": "srv"}, {"id": "sAUG27", "date": "2026-08-17", "level": "MED", "vendor": "powerleader", "cat": "demand", "title": "华为+宝德联合体1.54亿中标中国联通云智业务智算资源池123台AI服务器", "source": "云头条", "time": "2026-08-17", "summary": "2026年中国联通云智业务智算资源池设备及集成安装服务项目（预算1.72亿元）中标候选人公示：华为技术服务有限公司+宝德计算机系统股份有限公司联合体中标，投标总价1.54亿元（不含税）。采购内容为人工智能服务器123台、RoCE交换机63台、存储设备4台及集成服务。这是宝德与华为在运营商智算资源池的又一联合体中标，反映国产算力服务器在联通智算采购中的持续渗透。", "analysis": {"facts": ["华为+宝德联合体1.54亿中标中国联通智算资源池123台AI服务器+RoCE交换机+存储", "项目预算1.72亿、中标价1.54亿（不含税）", "昇腾生态厂商（昆仑/华鲲/长江计算/宝德）已成运营商智算集采主力"], "significance": "宝德（昇腾生态整机商）通过'华为联合体'绑定运营商智算采购，国产算力服务器在联通侧持续渗透，进一步挤压浪潮等靠国际GPU整机的厂商在运营商集采的空间", "impact": "运营商智算集采越来越倾向'华为/昇腾生态联合体'，浪潮在中移动51亿推理集采仅2.97亿、联通/电信同样承压，运营商渠道国产化替代趋势不可逆", "action": "浪潮在运营商渠道应转向'类CUDA生态+多元异构+液冷'差异化，守住中移动类CUDA标包（中兴8.85亿/新华三5.48亿已达），同时拓展非运营商政企/互联网大厂算力订单对冲"}, "url": "https://www.163.com/dy/article/L4LB3LNO0511D6RL.html"}, {"id": "sAUG18", "date": "2026-08-15", "level": "MED", "vendor": "inspur", "cat": "server", "title": "浪潮信息超节点进入出货放量期：元脑SD200完成Kimi/DeepSeek/GLM大模型软硬协同优化", "source": "每日经济新闻", "time": "2026-08-15", "summary": "浪潮信息发布超节点AI服务器元脑SD200和超扩展AI服务器元脑HC1000，已完成Kimi、DeepSeek、GLM等主流大模型软硬协同优化。元脑SD200运用多主机低延迟内存语义通信架构，单机实现64路国产AI芯片高速统一互连，可承载4万亿参数单体模型；元脑HC1000推理成本首次击破1元/百万token。国产AI卡超节点产品预计下半年规模化出货。", "analysis": {"facts": ["元脑SD200单机64路国产AI芯片高速互联，可承载4万亿参数单体模型", "元脑HC1000推理成本首破1元/百万token，为推理商业化树立新标杆", "基于国产AI卡的超节点产品预计2026下半年规模化出货，Q3业绩将体现"], "significance": "浪潮超节点+推理卡组合是应对昇腾生态的主要筹码，1元/百万token的成本优势对推理客户吸引力大", "impact": "Kimi/DeepSeek/GLM适配意味着互联网大厂推理服务器采购浪潮仍有优势，但运营商推理市场对昇腾生态依赖度太高", "action": "把1元/百万token的成本数据和元脑SD200/HC1000技术参数做成材料，重点对西北片区的互联网推理需求（推荐/搜索/安防视频分析）打一波攻势，弥补运营商推理份额损失"}, "url": "https://xueqiu.com/5370468097/404887661", "__side": "srv"}, {"id": "sAUG16", "date": "2026-08-14", "level": "HIGH", "vendor": "sugon", "cat": "capital", "title": "中科曙光全国产十万卡集群曙光8000落成运营：首周日均15万作业、启动第二套80亿募投", "source": "上海证券报", "time": "2026-08-14", "summary": "中科曙光宣布中国首个全国产十万卡AI超集群「曙光8000（登峰）」正式落成并接入国家超算互联网。上线首周即满载运行，日均处理作业超过15万个、单日峰值超50万个，已完成近千项超智融合应用适配。同时公司与北京科学智能研究院启动第二套全国产十万卡超智融合算力系统建设，80亿元可转债募投项目将重点建设先进算力集群、下一代AI训推一体机和国产化先进存储。", "analysis": {"facts": ["曙光8000全国产十万卡集群接入国家超算互联网郑州核心节点，首周满载日均15万作业", "启动第二套全国产十万卡超智融合算力系统，80亿可转债募投先进算力集群项目", "ScaleX640通信域扩展至640卡，scaleFabric提供400Gb/s带宽和＜1μs时延，支持10万卡以上集群扩展"], "significance": "中科曙光+海光全栈闭环能力已完整体现，十万卡集群意味着超节点+超大规模集群进入规模化交付期", "impact": "对浪潮信息的威胁集中在国家超算互联网项目和国资智算项目总包市场，浪潮要在渠道层绑定省级智算中心投资人；同时液冷+海光芯片的适配机型要跟紧", "action": "西北片区如果有国资AIDC项目（甘肃庆阳、宁夏中卫、内蒙古和林格尔），中科曙光很可能带海光整体方案介入，浪潮要提前带上自研液冷方案对标"}, "url": "https://www.cfi.cn/p20260814002354.html", "__side": "srv"}, {"id": "sAUG15", "date": "2026-08-13", "level": "HIGH", "vendor": "xfusion", "cat": "capital", "title": "超聚变创业板IPO预计8月底上会：3778万股发行，80亿募资投向新一代算力基础设施", "source": "证券时报", "time": "2026-08-13", "summary": "超聚变创业板IPO问询阶段结束，预计2026年8月底前上会。公司拟发行不超过3778万股，募资80亿元用于新一代算力基础设施研发及产业化。2023-2025年营收从250.92亿元增至582.46亿元（CAGR 52.36%），归母净利润从5.07亿元增至10.30亿元，AI服务器收入占比从25.03%升至50.91%。截至2025年底在手订单226.85亿元，客户覆盖移动、阿里、腾讯等头部。", "analysis": {"facts": ["2023-2025营收250.92→442.67→582.46亿元（CAGR 52.36%），归母净利润5.07→7.22→10.30亿元", "AI服务器收入从62.78亿(25%)增至296.29亿(51%)，成为核心增长引擎", "毛利率从14.27%降至8.58%且经营现金流连续三年为负，呈「高增长低毛利强投入」特征"], "significance": "若上会成功将成为河南史上最大IPO（80亿），超聚变估值修复到合理区间后会进一步提升渠道打单能力和现金储备", "impact": "对浪潮是智算赛道最强的直接对手：西北互锁型智算中心项目和移动联通集采里，超聚变上市后融资能力会明显增强，价格战可能加剧", "action": "重点关注其上市后募投项目落地节奏（高性能AI训练/推理服务器），相应调整自家产品毛利预期，渠道报价要留足弹性"}, "url": "https://guba.eastmoney.com/news,601108,1758455232,d.html", "__side": "srv"}, {"id": "sAUG14", "date": "2026-08-12", "level": "MED", "vendor": "h3c", "cat": "capital", "title": "新华三AI产业生态峰会合肥举行：发布S90000全液冷整机+X20000 AI原生存储+102.4T智算芯片", "source": "新华三官网", "time": "2026-08-12", "summary": "新华三在合肥举办「徽·聚数智」AI产业生态峰会，正式发布S90000高密全液冷整机服务器、X20000 AI原生存储、全系列单芯片102.4T智算交换芯片。UniPoD S80000超节点覆盖32卡至1024卡规模，最高可弹性扩展至16384卡，训练性能提升70%、推理性能提升3倍。同时发布灵犀智算解决方案，已在杭州、郑州、咸阳、马鞍山、贵阳、西宁等城市推出「图灵小镇」模式。", "analysis": {"facts": ["S90000高密全液冷整机+X20000 AI原生存储+单芯片102.4T智算产品三套组合拳", "UniPoD S80000覆盖32卡至1024卡，弹性扩至16384卡，训练性能+70%、推理+3倍", "灵犀智算方案覆盖大规模训练/私域训推一体/智能体应用，已在6城落地图灵小镇"], "significance": "新华三把「算网存云安维」全栈打包成生态联盟，通过城市云+图灵小镇下沉到区域AIDC市场，和浪潮的渠道打法正面冲突", "impact": "西北片区政企客户收新华三整栈方案的概率提升；S90000单机柜1024卡超节点对应浪潮元脑SD200是同档位竞品，需要立即对标技术规格和报价", "action": "和西安/兰州/银川的城市云项目接触时，要把浪潮超节点+液冷+存储打包推荐，避免被新华三整套方案锁定"}, "url": "https://www.h3c.com/cn/d_202608/2893487_30008_0.htm", "__side": "srv"}, {"id": "sAUG17", "date": "2026-08-12", "level": "MED", "vendor": "inspur", "cat": "capital", "title": "中国移动推理AI服务器集采浪潮仅2.97亿元份额垫底，在昇腾类CUDA两生态间被边缘化", "source": "C114通信网", "time": "2026-08-12", "summary": "中国移动51.12亿推理型AI服务器集采全部落地，浪潮信息在类CUDA生态标包中获得2.97亿元份额，在9家中标候选人中垫底。相比中兴8.85亿、河南昆仑（超聚变）8.37亿、华鲲振宇6.68亿、新华三5.48亿、宝德4.95亿，浪潮份额明显偏弱 window.UPD=[{"id": "uSEP02", "date": "2026-09-04", "level": "MED", "vendor": "nvidia", "cat": "policy", "title": "英伟达10-K确认对华供应口径：H20逐案许可出货、H200小批量+25%关税、Blackwell全系禁售", "source": "TipRanks/英伟达10-K", "time": "2026-09-04", "summary": "英伟达10-K风险因素确认对华供应现状：H20自2025年8月起逐案许可恢复出货（美方官员表示期望获得15%收入分成）；H200自2026年2月获小批量许可、需美国境内检验并加征25%关税、迄今未产生任何收入；Blackwell全系（B100/B200/B300）2025年11月起禁售。中国监管对Mellanox收购承诺的合规审查仍在进行。市场口径：当前合规可买仅H20（主力）、H200（逐案+关税+限量）、L40S/L20/L4（受限推理卡），消费级RTX 5090D暂停出口。", "analysis": {"facts": ["H20逐案许可出货中，美方要求15%收入分成", "H200小批量许可+25%关税+美检，至今零收入", "Blackwell全系禁售，5090D暂停"], "significance": "对华供应'红线清晰但随时可变'，H200零收入说明许可≠市场，国产替代窗口不可逆", "impact": "高端训练卡供给不确定性持续，客户AI训练项目转向国产超节点或海外云，推理侧H20/L20仍是过渡主力", "action": "在客户算力规划中附'英伟达可供给清单+国产替代对照表'，避免客户按过时攻略选型"}, "url": "https://www.tipranks.com/stocks/tse:nvda/risk-factors"}, {"id": "uSEP03", "date": "2026-09-04", "level": "HIGH", "vendor": "amd", "cat": "upstream", "title": "AMD正式发布MI400+Helios机柜：432GB HBM4，OpenAI Q4上线、Anthropic 2GW协议", "source": "AMD Advancing AI 2026", "time": "2026-09-04", "summary": "AMD在Advancing AI 2026正式发布MI400系列与Helios机柜方案：MI455X基于CDNA5/TSMC N2工艺、432GB HBM4、FP8算力20 PFLOPS；Helios单柜72 GPU+18颗EPYC Venice、2.9-3 EFLOPS、31TB HBM4，宣称推理tokens/美元领先竞品约30%。OpenAI预计Q4起上线Helios并加速部署至2027，Anthropic签署最高2GW部署协议并联合优化ROCm，Meta/Oracle/Cerebras跟进；MI400系列Q4出货，OEM含HPE、联想、超微。", "analysis": {"facts": ["MI455X 432GB HBM4 / 20 PFLOPS FP8", "Helios单柜2.9 EFLOPS、推理tokens/美元+30%", "OpenAI Q4上线、Anthropic 2GW，联想/HPE/超微OEM"], "significance": "英伟达之外第二个全栈AI算力供应体系成型，UALink/ROCm开放生态对CUDA形成差异化", "impact": "推理预算敏感型客户多了一个议价筹码；国内OEM可借AMD路线承接对CUDA依赖低的推理负载", "action": "跟踪AMD方案在国内金融/互联网推理项目的试点报价，作为对冲英伟达涨价的备选选项"}, "url": "https://techtravelmonitor.com/2026/09/04/amd-delivers-full-stack-compute-for-the-agentic-ai-era"}, {"id": "uSEP04", "date": "2026-09-04", "level": "MED", "vendor": "intel", "cat": "upstream", "title": "Hot Chips 2026：Intel展示Diamond Rapids（256核/PCIe 6.0，2027上市）与480GB推理GPU", "source": "Hot Chips 2026/百度百科", "time": "2026-09-04", "s facts": ["新增Scale-In网络层级（BlueField-4）", "Spectrum-X Multiplane可扩至51.2万GPU", "推理负载decoding主导75-97%，芯片设计两极分化"], "significance": "网络分层细化+CUDA开放化，英伟达加固生态护城河的同时向开放阵营抛橄榄枝", "impact": "Scale-In架构将影响下一代智算中心网络设计，客户机房网络规划需预留新层级设备空间", "action": "关注Scale-In设备在国内落地节奏，大型智算项目方案预留对应网络架构弹性"}, "url": "https://baike.baidu.com/item/Hot%20Chips%202026/68748688"}, {"id": "uSEP01", "date": "2026-09-03", "level": "HIGH", "vendor": "huawei", "cat": "upstream", "title": "昇腾950拟年内出货75万颗：字节/阿里测试下单，国产AI芯片产能缺口约38%", "source": "行业机构测算/华为半年报", "time": "2026-09-03", "summary": "华为2026上半年营收4678亿元、研发1213亿元创新高；据行业机构测算，昇腾950拟年内出货75万颗，字节、阿里等头部云厂商已完成测试并下单，通过互联网大客户最严准入验证。产能侧，2026年底国内AI芯片年产能约260万颗、对应需求约420万颗、缺口约38%，其中华为产能约占43%、寒武纪9-11%。Atlas 950超节点（灵衢1024卡、可扩8192卡）Q4批量上市，光博会/华为全联接/云栖三大会构成交付集中检验窗口。", "analysis": {"facts": ["昇腾950拟年内出货75万颗，字节/阿里测试下单", "国产AI芯片产能约260万颗 vs 需求420万颗，缺口38%", "华为产能占国内约43%"], "significance": "昇腾950进入规模商用，产能而非需求成为国产算力的天花板", "impact": "产能缺口意味着国产AI服务器交付周期拉长，渠道端'有货即王'；通用服务器芯片供给可能被进一步挤压", "action": "提前与供应链确认Q4国产整机配额，大客户项目报备交付周期留足缓冲"}, "url": "https://www.wenqu123.com/news-detail-1257.html"}, {"id": "uSEP06", "date": "2026-09-01", "level": "MED", "vendor": "skhynix", "cat": "upstream", "title": "高盛维持存储双雄买入：Q3服务器DRAM预计+13-18%，产能优先供给服务器/HBM", "source": "财联社/高盛研报", "time": "2026-09-01", "summary": "高盛9/1存储价格跟踪：Q3 DRAM与NAND平均售价走势符合预期，维持三星电子/SK海力士'买入'。TrendForce将Q3 PC DRAM涨幅预期由15-20%上调至18-23%，服务器DRAM环比+13-18%。8月DDR5 64GB服务器模组1500美元（环比+1%）、DDR4 64GB维持1295美元；DDR5 16Gb现货较合约溢价16%、DDR4 8Gb溢价43%。供应商持续把有限产能优先配置给服务器DRAM和HBM，限制传统存储供给，成为支撑2027年价格的重要因素；手机存储需求则受库存上升拖累明显降温。", "analysis": {"facts": ["Q3服务器DRAM预计环比+13-18%", "DDR5 16Gb现货较合约溢价16%、DDR4 8Gb溢价43%", "原厂产能优先服务器DRAM/HBM，手机存储降温"], "significance": "涨价结构性分化：服务器/PC强、手机弱，原厂控产是价格主锚", "impact": "服务器内存是本轮涨价最强细分，整机厂成本差异将直接体现在Q4报价上", "action": "报价单中DDR4/DDR5分开核算，向客户明示现货溢价趋势，缩短报价有效期"}, "url": "https://xueqiu.com/9252950692/407627347"}, {"id": "uSEP07", "date": "2026-09-01", "level": "MED", "vendor": "market", "cat": "market", "title": "存储成本冲击传导至手机：华为小米荣耀集体涨价，存储套片500元涨至2200元成BOM第一大项", "source": "新浪科技", "time": "2026-09-01", "summary": "9月1日华为、小米、荣耀等主力机型集体涨价300-500元，小米年内第三次调价。同规格内存价格较去年Q1涨近4倍，12GB+256GB存储套片从约500元涨至2200元，首次超过SoC成为手机物料成本第一大项。多家厂商将新一代旗舰出货计划下调30-50%。小米卢伟冰预判2026下半年内存涨价趋缓但高位持续，涨价周期或延续至2027年底；Counterpoint预计市场2028年才真正复苏。", "analysis": {"facts": ["存储套片500→2200元，首次成手机BOM第一大项", "厂商下调旗舰出货计划30-50%", "涨价周期或延续至2027年底"], "significance": "存储成本冲击从服务器传导到全消费电子，验证'AI产能虹吸'的全面性", "impact": "消费终端减产将进一步腾挪产能但整体偏紧，服务器DRAM供给竞争加剧、配置成本继续上行", "action": "对PC/终端类渠道客户提示内存成本风险，服务器与终端同涨背景下优先保障服务器订单内存配给"}, "url": "https://www.sina.cn/gc/article/niqhmvz6796881.html"}, {"id": "uAUG16", "date": "2026-08-28", "level": "HIGH", "vendor": "nvidia", "cat": "capital", "title": "英伟达AI服务器拟涨价15%：Vera Rubin新系统涨价超15%，存储涨价超预期供应紧张或持续至FY2028", "source": "韭研公社", "time": "2026-08-28", "summary": "机构梳理五大利好：英伟达高业绩指引主因之一是AI服务器拟涨价，搭载Vera Rubin平台的新系统涨价超15%；英伟达明示存储涨价超预期、供应紧张或持续到FY2028。涨价的直接原因是HBM/DRAM内存成本抬升(三星/海力士/美光将超70%先进产能转向HBM)。AI服务器整机涨价沿'存储—光模块—PCB—AIDC—散热'链条传导，同时强化国产芯片+超节点的'降本替代'逻辑。智谱首次披露创纪录流量均来自国产芯片，华为埃及投建数据中心并拟出售昇腾950芯片。", "analysis": {"facts": ["英伟达AI服务器拟涨价，Vera Rubin新系统涨价超15%", "存储涨价超预期、供应紧张或持续至FY2028", "智谱创纪录流量产自国产芯片，华为拟出海昇腾950"], "significance": "英伟达用涨价把上游存储成本压力向下游转嫁，AI算力'贵金属化'从芯片蔓延到整机；涨价既压缩国产通用服务器利润空间，又放大国产超节点'系统级降本'的替代价值", "impact": "高性能AI服务器整机采购成本中枢上移，渠道议价空间收窄、锁价需求强烈；国产昇腾/海光DCU超节点作为低成本备选，性价比优势进一步凸显", "action": "立即提示渠道客户对高端AI服务器锁价签长单，同时准备国产超节点替代方案作为对冲选项，把涨价叙事转化为国产算力的销售切入点"}, "url": "https://www.jiuyangongshe.com/a/20a45jf5882"}, {"id": "uAUG19", "date": "2026-08-28", "level": "MED", "vendor": "market", "cat": "policy", "title": "发改委：1-7月我国集成电路出口额1.49万亿元同比+91.6%，半导体加速成长为全球竞争力新兴支柱产业", "source": "国家发展改革委", "time": "2026-08-28", "summary": "8月28日国家发改委发布会：2026年1-7月我国集成电路出口额达1.49万亿元(+91.6%)，产业呈现四大特点——关键核心技术持续突破、企业竞争力增强(前7月集成电路制造业投资+11.5%)、产能利用率保持高位(主要晶圆代工企业90%以上)、产业链安全水平提升(设备材料从'单点突破'迈向'全链条协同')。下一步将聚焦'十五五'规划部署，发挥新型举国体制优势，全链条推动集成电路关键核心技术攻关取得决定性突破。", "analysis": {"facts": ["1-7月集成电路出口额1.49万亿+91.6%，制造业投资+11.5%", "主要晶圆代工产能利用率保持90%以上", "下一步全链条推动关键核心技术攻关"], "significance": "官方数据坐实国产芯片'量价齐升'：在海外出口管制倒逼下，国产存储(长江存储/长鑫)、国产CPU/DCU(海光/龙芯/昇腾)产能释放+出口高增长，支撑国产服务器整机的供应链安全", "impact": "政策持续加码国产化，运营商/政企信创采购向国产芯片服务器倾斜的趋势不可逆，渠道若仍押注纯x86通用盘将踏空", "action": "把'国产芯片出口+91.6%、产能利用率90%+'作为向政企客户论证国产方案成熟度的政策背书，推动信创订单转化"}, "url": "https://baike.baidu.com/item/%E9%AB%98%E7%AB%AF%E8%8A%AF%E7%89%87/68138658"}, {"id": "uAUG15", "date": "2026-08-27", "level": "HIGH", "vendor": "nvidia", "cat": "capital", "title": "英伟达Q2财报营收962亿+106%、数据中心890亿+117%：净利596.88亿，提前一年给出2028财年+70%增长指引", "source": "新华社", "time": "2026-08-27", "summary": "8月26日英伟达发布2027财年第二季度财报：营收962.21亿美元(+106%)，净利润596.88亿美元(+126%)，毛利率75%。数据中心业务营收890亿美元(+117%)、占总营收92.5%，主要受益Blackwell Ultra基础设施快速部署。Q3营收指引1080亿美元(市场预估1051.5亿)，并提前一年给出2028财年约70%的增长预期(显著高于分析师约45%)。亚马逊将在AWS额外部署200万块Blackwell Ultra/Rubin GPU。黄仁勋称AI已达拐点、'算力正转化为收入'；但应收账款从385亿攀升至630亿美元。", "analysis": {"facts": ["Q2营收962.21亿+106%、净利596.88亿+126%、毛利率75%", "数据中心890亿+117%占总营收92.5%，Blackwell Ultra为主引擎", "2028财年指引+70%远超预期，亚马逊额外200万块GPU订单"], "significance": "英伟达用一份碾压式财报+超远期指引回击'AI需求见顶'论，全球AI Capex上行周期被再次确认；其数据中心盘子持续扩大，上游HBM/存储/光模块/液冷全链受益", "impact": "海外算力景气度外溢支撑A股算力板块情绪(服务器厂商估值锚)；但英伟达NVL/整机柜涨价趋势也将抬升国产替代的性价比逻辑", "action": "向渠道传递'AI投入未到顶、海外Capex持续上修'的确定性，对冲分销商对下半年需求放缓的担忧，稳住Q3信心"}, "url": "https://www.toutiao.com/article/7678517518008386082/"}, {"id": "uAUG17", "date": "2026-08-26", "level": "HIGH", "vendor": "skhynix", "cat": "upstream", "title": "存储涨价兑现财报：SK海力士Q2净利暴增1242%至93.9万亿韩元，DDR5现货同比+483%、服务器DRAM合约价Q1+90%", "source": "今日头条", "time": "2026-08-26", "summary": "存储超级周期进入财报兑现期：SK海力士2026Q2净利润同比+1242%至93.9万亿韩元；美光毛利率72.6%、签16份长约收220亿美元保证金。美光Hot Chips 2026披露HBM单颗耗约3倍DDR5晶圆面积，HBM吃掉DRAM晶圆开工率23%。现货市场DRAM'贵金属化'：DDR5消费级现货同比+483%、服务器DRAM Q1合约价环比+90%、韩国DRAM出口单价+576%。高盛预测2026-2028全球DRAM供需缺口5.0%/5.9%/3.9%，SK海力士CEO预警2027年或成史上最严重缺货年，产能紧张至少延续至2027下半年。", "analysis": {"facts": ["SK海力士Q2净利+1242%至93.9万亿韩元，美光毛利率72.6%签16份长约", "DDR5现货同比+483%、服务器DRAM Q1合约价+90%", "高盛预测2026-2028缺口5.0%/5.9%/3.9%，海力士CEO预警2027最严重缺货"], "significance": "存储涨价从'预期'进入'财报暴利兑现'阶段，且供给缺口被原厂用'HBM虹吸+长约锁价'固化，服务器整机成本中枢将持续上移一年以上", "impact": "服务器内存条/DDR5采购成本被锁死在历史高位，整机毛利承压；但提前锁价、有低价库存的渠道反而享受存货增值红利", "action": "渠道侧：①提醒客户对内存/存储型配置提前锁价保供；②评估在手订单的存储成本敞口，必要时与上游谈判季度阶梯价，把涨价风险写进报价条款"}, "url": "https://www.toutiao.com/a7679305265857954338"}, {"id": "uAUG18", "date": "2026-08-25", "level": "MED", "vendor": "intel", "cat": "upstream", "title": "Intel亮相Diamond Rapids至强：256 P核心+18A-P制程+Fan-out Fabric架构，押注AI Agent基础设施", "source": "华尔街见闻", "time": "2026-08-25", "summary": "Hot Chips 2026上Intel展示第七代至强服务器处理器Diamond Rapids：最高256个Panther Cove-X架构P核心(较上代Xeon 6提升50%+)，Intel 18A-P制程，由22个独立裸片拼装，引入全新Fan-out Fabric架构；内存带宽1.6TB/s(16通道MRDIMM)、128条PCIe Gen6通道、CXL 3.0、1.28GB末级缓存，TDP最高650W，弃用超线程(SMT)。定位于企业级AI Agent基础设施，直面AMD EPYC Venice(256核Zen6)与英伟达CPU布局。CEO陈立武暗示路线图加速，继任Coral Rapids计划2028年中推出。", "analysis": {"facts": ["Diamond Rapids最高256 P核心，18A-P制程，Fan-out Fabric新架构", "1.6TB/s内存带宽、128条PCIe Gen6、CXL 3.0、1.28GB LLC，弃用SMT", "定位AI Agent编排层，继任Coral Rapids计划2028年中"], "significance": "Intel把至强重新定位为大模型'编排层'(Orchestration)CPU，与推理加速器Crescent Island组成'CPU调度+GPU推理'的Agent算力方案，在x86服务器市场正面迎战AMD与英伟达", "impact": "下一代x86服务器CPU竞争(Intel Diamond Rapids vs AMD Venice)白热化，利好服务器整机厂商的议价空间与多路线供货选择", "action": "通用服务器选型时关注256核CPU带来的整机密度跃升，提前了解Diamond Rapids/EPYC Venice的上市节奏，在高端通用机型报价中预留新平台切换窗口"}, "url": "https://www.toutiao.com/article/7677851495982793222/"}, {"id": "uAUG14", "date": "2026-08-21", "level": "HIGH", "vendor": "market", "cat": "capital", "title": "长江存储科创板IPO获受理拟募资330亿刷新纪录：Q1净利333亿、全球NAND第三", "source": "凤凰网财经", "time": "2026-08-21", "summary": "8月21日晚，上交所公告长江存储科创板IPO获受理，拟募资330亿元，刷新科创板拟募资历史纪录。公司2026年Q1单季净利润333亿元（比已上市的长鑫科技还高近90亿）、净利率高达71%，全球NAND闪存出货量第三（仅次于三星、SK海力士），中国第一。按审核进度最快四季度挂牌，届时国产'存储双雄'（长鑫DRAM+长江存储NAND）正式在A股凑齐。紧随其后燧原科技（国产GPU，已注册生效）、超聚变（服务器，已受理）等硬科技巨头也在排队上市。", "analysis": {"facts": ["长江存储科创板IPO获受理，拟募资330亿刷新科创板纪录", "Q1净利333亿、净利率71%，全球NAND出货第三、中国第一", "国产存储'长鑫DRAM+长江存储NAND'双雄将齐聚A股"], "significance": "国产NAND龙头资本化是存储芯片国产替代的里程碑，330亿募资投入产线升级与研发，将进一步强化国产存储供给，为服务器厂商提供NAND/SSD国产化选项、对冲海外原厂涨价", "impact": "长江存储放量+国产NAND崛起，为浪潮等整机厂提供第二存储供应源，部分对冲三星/海力士/美光涨价压力；但短期国际原厂仍主导HBM/企业级SSD供求", "action": "关注长江存储企业级SSD/NAND的产品成熟度与供货节奏，评估在通用服务器/存储机型中引入国产NAND降本的可能性，作为对外资原厂涨价的谈判筹码"}, "url": "https://finance.ifeng.com/c/8vnU8qtZLQk"}, {"id": "uAUG09", "date": "2026-08-19", "level": "MED", "vendor": "intel", "cat": "upstream", "title": "Intel Crescent Island显存升级至480GB LPDDR5X：350W风冷PCIe卡，Hot Chips 2026对标Rubin/MI400", "source": "Hot Chips", "time": "2026-08-19", "summary": "Intel官方将Crescent Island推理GPU显存从160GB LPDDR5X更新至最高480GB，同时保持350W风冷PCIe卡形态。480GB容量超过AMD MI455X的432GB也高于NVIDIA Rubin的288GB，支持FP4/MXFP4/FP64等多精度格式。Intel未公布显存带宽、scale-up互联和峰值算力，产品仍处于开发测试阶段，预计2026下半年向客户送样。", "analysis": {"facts": ["Crescent Island显存从160GB升级至480GB LPDDR5X，超过AMD MI455X的432GB和NVIDIA Rubin的288GB", "350W风冷PCIe卡形态，可直接进入常规企业服务器无需液冷整柜", "Xe3P架构支持FP4/MXFP4/FP64，软件沿用Arc Pro平台的Xe生态"], "significance": "Intel选择「大容量+低功耗PCIe卡」差异化路线，避开NVIDIA/AMD液冷整柜主战场，切企业推理长尾", "impact": "480GB让单卡能承载更多模型权重+KV Cache减少切分，对国产推理服务器厂商（如浪潮NF5688G8）是一个差异化选择", "action": "浪潮在国产化推理机型上可关注Crescent Island量产后的性价比，如果带宽规格过关，可能成为H20/B30A之外的推理补充"}, "url": "https://hotchips.org/", "__side": "up"}, {"id": "uAUG11", "date": "2026-08-19", "level": "HIGH", "vendor": "nvidia", "cat": "policy", "title": "NVIDIA H200对华出货解冻：字节/腾讯各获1万颗，仅达配额13%，深港安置", "source": "Financial Times", "time": "2026-08-19", "summary": "据FT报道，NVIDIA H200 AI芯片已小批量进入中国大陆，字节跳动、腾讯近几周各收货约1万颗。美国1月许可框架下每家获准客户可购最多7.5万颗，实际交付仅达配额13%。北京要求企业可将芯片运往中国香港（独立海关）使用，既不违背国产替代大方向、又能获取先进算力。联想等分销商已通知客户可重新下单含H200产品（需发改委单独审批）。H200算力约为H20（此前对华最强合法芯片）6倍，但Blackwell仍被禁。", "analysis": {"facts": ["字节/腾讯各获约1万颗H200，仅为7.5万颗配额的13%，7个月零交付后首次启动", "H200算力约H20的6倍，但Blackwell仍禁；联想/富士康等分销商获准", "北京推动芯片安置在中国香港使用，兼顾国产替代与算力需求"], "significance": "中美对H200的双向管制出现松动，是2025年以来NVIDIA对华GPU出口政策的关键转折，但13%的超低交付率说明供给/合规/需求三方博弈仍在，短期难放量", "impact": "H200解冻缓解头部互联网大厂训练算力缺口，但对浪潮等整机厂而言，H200供给仍稀缺且需发改委审批，国际GPU服务器交付节奏与毛利率仍受制于芯片配额", "action": "跟踪H200后续配额是否放量（是否逼近7.5万上限），若放量将利好浪潮含NVIDIA整机的交付；同时警惕其挤压国产昇腾/寒武纪推理市场，动态调整算力产品组合"}, "url": "https://insideai.news/news/ai-hardware-infrastructure/nvidia-h200-chips-reach-china-in-small-shipments-ft-reports/8148"}, {"id": "uAUG12", "date": "2026-08-19", "level": "HIGH", "vendor": "market", "cat": "upstream", "title": "摩根士丹利：Q3成熟DRAM涨价50%、SLC NAND每季涨50%，存储涨价仍激进", "source": "财联社", "time": "2026-08-19", "summary": "摩根士丹利最新预测：2026年Q3 DDR4等成熟DRAM价格将上涨50%、Q4再涨10%；SLC NAND闪存今年剩余两个季度每季上涨50%。HBM消耗硅晶圆约为传统DRAM的3倍，三大原厂持续将产能转向HBM/DDR5，成熟DRAM/NAND供给被系统性压缩。美银数据：8月DDR5-5600/6400 24GB现货价环比+8%、同比+483%（一年前8美元现近47美元）。瑞银预测到2027年仅NVIDIA就消耗251亿GB HBM。大摩上调旺宏、华邦、力积电、兆易创新盈利预期。", "analysis": {"facts": ["大摩预测Q3成熟DRAM涨价50%、Q4再涨10%，SLC NAND每季涨50%", "DDR5 24GB现货同比+483%（8美元→47美元），8月环比再+8%", "HBM晶圆消耗是传统DRAM的3倍，原厂产能向HBM/DDR5倾斜"], "significance": "存储超级周期进入'涨价加速段'，成熟制程DRAM/NAND接力HBM涨价，服务器BOM成本全线承压，这是渠道报价与锁价的最后窗口期", "impact": "浪潮大存储客户（视频/推荐/广告/超算）面临10-20%甚至更高提价，Q4若再涨30%将严重压缩整机毛利率；中小模组厂/企业拿料难度加大", "action": "立即通知西北所有存储型客户：8-10月下单锁定内存/SSD价格，签'锁量不锁价'长单，11月后接单毛利率将被压缩至3-4%，涨价必须转嫁客户"}, "url": "https://www.toutiao.com/article/7675648946270519859"}, {"id": "uAUG10", "date": "2026-08-15", "level": "HIGH", "vendor": "samsung", "cat": "upstream", "title": "三星HBM4 12层样品能效+16%，2026H2量产价格700美元，较HBM3E溢价20-30%", "source": "TrendForce", "time": "2026-08-15", "summary": "三星交付12层HBM4样品，能效较上一代提升16%、热阻特性改善逾14%。12层48GB版本报价约700美元，较HBM3E溢价20-30%。除12层48GB版本外还将推出32GB（8层）和64GB（16层）版本覆盖不同客户需求。SK海力士随后预计跟进涨价至同等区间，HBM4将成为2026-2027年AI超节点服务器的关键物料。三星/SK海力士Q1-Q2营业利润预计将创历史新高（摩根士丹利预测三星全年+464%、海力士+280%）。", "analysis": {"facts": ["三星12层HBM4样品能效+16%、热阻改善14%，2026H2量产价格约700美元较HBM3E+20-30%", "三星HBM4产品线覆盖8层32GB/12层48GB/16层64GB，量产节奏按客户时间表推进", "摩根士丹利预测三星2026全年营业利润+464%，海力士+280%，存储超级周期全面兑现"], "significance": "HBM4涨价直接推高AI超节点服务器BOM成本的20-30%，浪潮元脑SD200、超聚变、新华为三1024卡超节点的报价需要提前考虑HBM溢价", "impact": "渠道报价上2026下半年-2027上半年任何AI超节点整机柜项目都必须包含15-20%的HBM溢价，否则毛利率被直接压缩到不可接受水平", "action": "浪潮应加快和三星/SK海力士的HBM4长单锁定谈判，避免Q4进一步涨价10%+；同时通知客户HBM4整机柜2026 H2出货会贵20%"}, "url": "https://gu.qq.com/resources/shy/news/detail-v2/index.html?t=1#/index?_tentrees_trans=0&id=SN20260602143044a72b4ab7", "__side": "up"}, {"id": "uAUG08", "date": "2026-08-13", "level": "HIGH", "vendor": "amd", "cat": "upstream", "title": "AMD Helios机架级AI平台正式进入生产：72颗MI455X+Zen 6 Venice CPU+31TB HBM4，OpenAI下季部署", "source": "EE Times Asia", "time": "2026-08-13", "summary": "AMD在Advancing AI 2026宣布Helios机架级AI平台已进入生产阶段。Helios包含72颗Instinct MI455X GPU、18颗EPYC「Venice」9006系列（Zen 6，台积电2nm）CPU、Pensando网络，整机提供31TB HBM4容量、1.4PB/s聚合带宽、2.9 ExaFLOPS FP4推理/1.4 ExaFLOPS FP8训练、260TB/s scale-up UALoE带宽。AMD与Anthropic合作部署最高2GW MI450系列容量，OpenAI计划2026 Q4上线Helios。", "analysis": {"facts": ["Helios整架72 MI455X+18 EPYC Venice CPU、31TB HBM4、1.4-1.7PB/s聚合带宽", "FP4推理2.9 ExaFLOPS、FP8训练1.4 ExaFLOPS，scale-up 260TB/s UALoE，scale-out 43TB/s", "Anthropic签2GW MI450系合约、微软Azure/Meta/Oracle/OpenAI均为客户，OpenAI 2026 Q4起部署"], "significance": "AMD从GPU芯片商向机架级系统商战略转型全面落地，Helios对标NVIDIA NVL72且采用OCP Open Rack Wide开放标准，给超节点市场多了一个玩家", "impact": "对浪潮等整机商是双刃剑：AMD Helios采用开放标准了更多整柜集成空间，但OEM设计主导权会受AMD挤压；国产化上可与海光对标学习", "action": "浪潮要跟踪AMD Venice CPU+Helios的出货节奏，并考虑在下一代超节点产品中同时支持NVIDIA Rubin和AMD Helios两套生态，避免被单一供应商绑定"}, "url": "https://www.eetasia.com/lisa-su-puts-rack-scale-ai-at-center-of-amds-next-growth-phase", "__side": "up"}, {"id": "uAUG13", "date": "2026-08-13", "level": "MED", "vendor": "hygon", "cat": "upstream", "title": "海光信息半年报：营收90.99亿+66.52%、净利17.98亿+49.69%，DCU适配400余款大模型", "source": "上证报/新浪财经", "time": "2026-08-13", "summary": "海光信息2026年半年报：营收90.99亿元（+66.52%），归母净利润17.98亿元（+49.69%）；Q2营收50.65亿（+65.32%）、净利11.11亿（+59.78%）。研发投入26.52亿（+55.05%），占营收29.15%。DCU产品已完成与DeepSeek、Qwen3、混元、智谱等400余款主流大模型全面适配优化，覆盖全球99%非闭源大模型；'CPU+DCU'双芯协同战略深化。销售毛利率55.21%。海光CPU/DCU构成国产计算芯片底座，与中科曙光（曙光8000超集群）深度绑定。", "analysis": {"facts": ["海光上半年营收90.99亿+66.52%、净利17.98亿+49.69%、Q2净利11.11亿+59.78%", "DCU适配400余款主流大模型，覆盖全球99%非闭源大模型", "研发投入26.52亿占营收29.15%，'CPU+DCU'双芯协同深化"], "significance": "海光DCU成为国产算力芯片中商业化最成熟的路线之一，'海光+曙光'全栈生态（十万卡超集群）技术壁垒持续加固，是浪潮国产化服务器对标的主芯片平台", "impact": "海光生态成熟=客户对国产算力接受度提升，浪潮国产化机型可借助海光CPU/DCU底座抢占信创/政企市场；但海光与曙光绑定加深也意味着浪潮需在'海光之外'建立多元异构差异化", "action": "浪潮西北片区在国产化/信创项目中，评估海光平台整机的价格与供货能力，与曙光/海光生态正面竞争时突出自身'多元异构+液冷+交付规模'优势"}, "url": "https://finance.sina.com.cn/jjxw/2026-08-19/doc-ininwiep9317223.shtml"}, {"id": "uAUG07", "date": "2026-08-11", "level": "HIGH", "vendor": "nvidia", "cat": "upstream", "title": "NVIDIA Rubin GPU正式量产：chiplet架构+288GB HBM4+50PFLOPS FP4，Hot Chips 2026重点展示", "source": "Hot Chips", "time": "2026-08-11", "summary": "NVIDIA宣布Rubin GPU进入量产爬坡和系统出货阶段。Rubin是NVIDIA首个chiplet架构GPU，由两颗接近光罩上限的计算die通过NV-HBI封装内连接，芯片规模3360亿晶体管含224个SM和896个Tensor Core。单颗GPU配288GB HBM4、带宽22TB/s，第三代Transformer Engine提供50 PFLOPS NVFP4推理算力。配套的Vera Rubin NVL72机架含72颗Rubin GPU+36颗Vera CPU，20.7TB HBM4、NVLink 6总带宽260TB/s。", "analysis": {"facts": ["Rubin GPU为chiplet架构，3360亿晶体管、224 SM、896 Tensor Core，两颗die经NV-HBI封装互连", "单GPU 288GB HBM4、带宽22TB/s、NVFP4推理50 PFLOPS；Vera CPU为88核Arm架构", "NVL72整柜72 GPU+36 Vera CPU，20.7TB HBM4、带宽汇总1580TB/s、NVLink 6交换260TB/s"], "significance": "Rubin+ Vera CPU+NVLink 6+ConnectX-9+BlueField-4形成一套完整硬件软件体系，量产后将定义2027年AI基础设施标准", "impact": "浪潮超节点（元脑SD200）要在Rubin NVL72出货前抢下国产智算客户，超节点降规格（288GB HBM3.5）带来的性价比优势是时间窗口", "action": "渠道和客户谈2027年AI基建规划时，必须把「Rubin+国产算力双轨方案」作为标配，避免客户被NVIDIA独家绑定；同时浪潮HC1000推理1元/百万token的成本优势要早打出"}, "url": "https://hotchips.org/", "__side": "up"}, {"id": "u09", "date": "2026-08-10", "level": "high", "vendor": "amd", "cat": "upstream", "title": "AMD Instinct MI455X参数公布：432GB HBM4，23.3TB/s带宽，对标Rubin", "source": "LeCompute/gpulnsights", "time": "08-07", "summary": "AMD Instinct MI455X与NVIDIA Rubin对标参数披露：单GPU 432GB HBM4（23.3TB/s带宽），8 XCD+2 IOD芯片chiplets架构。Helios 方案72 GPU+31TB总HBM，Scale-Up bandwidth与NVLink 6持平3.6TB/s，Scale-Out 43.2TB/s 高于Rubin的28.8TB/s 50%。", "analysis": {"impact": "AMD在HBM性价比上的代际优势首次超越NV持平：同样的训练白花下MI455X会便宜20%+，这将是AMD在AI服务器反弹的分水岭。", "action": "如果客户对成本敏感，2026-2027想推荐 MI455X。为后当集采就要为集采店里布局各类产品预览。"}, "url": "https://www.amd.com/en/products/accelerators/instinct/mi400/mi455x.html", "__side": "up"}, {"id": "u10", "date": "2026-08-06", "level": "high", "vendor": "samsung", "cat": "upstream", "title": "三星也警告内存短缺将持续到2027年", "source": "韩联社/每日经济新闻", "time": "08-06", "summary": "三星电子也警示称内存供应短缺将持续到2027年，与SK海力士的全 sinc共识。华福国际点评指出：供给与电力约束正在成为AI算力的新瓶颈，英伟达通过降低单卡HBM容量换取更多GPU交付。", "analysis": {"impact": "三星+SK海力士联手声明短缺到2027，说明这不是个短期性问题，是AI算力扩张的结构性约束。", "action": "直面客户时不要只用价格说话——现在说的是'都能不能交上货'。"}, "url": "https://www.toutiao.com/article/7670686234708148782/", "__side": "up"}, {"id": "u15", "date": "2026-07-28", "level": "high", "vendor": "market", "cat": "capital", "title": "国家统计局:上半年集成电路制造利润暴增2579.5%,服务器+689.3%,电子行业+96.9%", "source": "国家统计局/经济参考报", "time": "07-28", "summary": "国家统计局发布:上半年全国规上工业企业利润39479.9亿元,同比+18.7%。电子行业利润+96.9%为增速最高行业。细分:计算机整机制造+689.3%,集成电路制造+2579.5%,电子专用材料制造+209.7%,半导体分立器件+31.2%。截至6月底智能算力2185EFLOPS(+177%)。工信部称将加速算电一体化布局。", "analysis": {"impact": "官方数据确认AI和算力产业链进入超级景气周期,上游芯片、中游整机、下游应用全面受益", "action": "在国家统计局数据加持下,客户对企业IT投资的信心将增强"}, "url": "https://www.toutiao.com/article/7667409407306727963/", "__side": "up"}, {"id": "u16", "date": "2026-07-28", "level": "high", "vendor": "hygon", "cat": "upstream", "title": "海光信息H1预告:营收85-93亿(+55~70%),净利润17-18.3亿(+41~52%),国产CPU龙头加速放量", "source": "海光信息公告/经济参考报", "time": "07-28", "summary": "国产CPU龙头海光信息发布H1预告:营收85-93亿元(+55.56~70.20%),归母净利润17-18.3亿元(+41.50~52.32%)。国产x86 CPU+DCU双轮驱动,HSL高速互联+CUDA兼容构筑国产算力底座。下游服务器整机厂商(浪潮/联想等)对国产CPU需求持续增长。", "analysis": {"impact": "海光超预期增长印证国产CPU在服务器市场渗透加速,利好浪潮国产芯片机型放量", "action": "海光CPU供应充足情况下,加大国产芯片服务器在政企市场的推广力度"}, "url": "https://www.toutiao.com/article/7667409407306727963/", "__side": "up"}, {"id": "u0y", "date": "2026-07-09", "level": "high", "vendor": "skhynix", "cat": "upstream", "title": "SK海力士股价今早大涨7%+,三星涨3%+,韩国存储芯片股强势反弹", "source": "财联社/科创板日报", "time": "07-09 08:02", "summary": "7月9日早盘,SK海力士股价上涨逾7%,三星电子涨超3%。此前SK海力士9个交易日从近300万韩元跌至210万韩元(跌约30%),今日强势反弹。三星Q2业绩炸裂(利润89.4万亿韩元+1810%)后市场恐慌情绪消化,存储板块修复。", "analysis": {"impact": "存储芯片价格上行周期未变,短期恐慌后快速修复,对服务器BOM影响可控", "action": "Q3 DDR5/HBM采购节奏无需调整,维持原有备货计划"}, "url": "https://www.chinastarmarket.cn/detail/2421075", "__side": "up"}, {"id": "u0z", "date": "2 function matchArticle(kw){
  const words=kw.replace(/[：:,，、·\s]+/g,' ').split(' ').filter(w=>w.length>=2);

    if(s>bs){bs=s;best=a;}
  }
  return bs>=2?best:null;
}

          if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{const el=e.currentTarget;const o=el.textContent;el.textContent='已复制';setTimeout(()=>el.textContent=o,1200);});}}>
        <IconShare/>分享</button>
      <span className="ml-auto text-[11px] text-slate-400">{x.source||''}</span>
    </div>
  </div>;
}

function App(){
  const [dark,setDark]=useState(()=>{try{return localStorage.getItem('sic_theme')==='dark'}catch(e){return false}});
  useEffect(()=>{
    document.documentElement.classList.toggle('dark',dark);
    try{localStorage.setItem('sic_theme',dark?'dark':'light')}catch(e){}
  },[dark]);

  const [tab,setTab]=useState('全部');
  const [vendor,setVendor]=useState(null);
  const [time,setTime]=useState('近30天');
  const [chain,setChain]=useState('产业链全部');
  const [q,setQ]=useState('');
  const [topBtn,setTopBtn]=useState(false);
  const [hl,setHl]=useState(null);
  const searchRef=useRef(null);
  const [saved,setSaved]=useState(()=>{try{return JSON.parse(localStorage.getItem('sic_saved')||'[]')}catch(e){return[]}});
  const toggleSave=useCallback(id=>setSaved(s=>{
    const n=s.includes(id)?s.filter(x=>x!==id):[...s,id];
    try{localStorage.setItem('sic_saved',JSON.stringify(n))}catch(e){}
    return n;
  }),[]);

  useEffect(()=>{
    const onScroll=()=>setTopBtn(window.scrollY>600);
    window.addEventListener('scroll',onScroll);
    const onKey=e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT'){e.preventDefault();searchRef.current&&searchRef.current.focus();}};
    window.addEventListener('keydown',onKey);
    return ()=>{window.removeEventListener('scroll',onScroll);window.removeEventListener('keydown',onKey);};
  },[]);

  const base=useMemo(()=>pickByTab(tab),[tab]);
  const filtered=useMemo(()=>{
    let r=base;
    if(vendor)r=r.filter(x=>x.vendor===vendor);
    if(chain!=='产业链全部'){
      const m={'上游':'up','中游':'mid','下游':'down'}[chain];
      if(m)r=r.filter(x=>segOf(x)===m);
    }
    if(q.trim()){
      const t=q.trim().toLowerCase();
      r=r.filter(x=>(x.title+' '+(x.summary||'')+' '+(VN[x.vendor]||'')+' '+(x.source||'')).toLowerCase().includes(t));
    }
    if(time!=='全部时间'){
      const days={'近7天':7,'近30天':30,'近90天':90}[time];
      if(days){
        const lim=new Date(TODAY);lim.setDate(lim.getDate()-days);
        const cut=lim.toISOString().slice(0,10);
        r=r.filter(x=>(x.date||'')>=cut);
      }
    }
    return r;
  },[base,vendor,chain,q,time]);

  const timeline=useMemo(()=>{
    const m={};
    filtered.forEach(x=>{const d=x.date||'未知';(m[d]=m[d]||[]).push(x);});
    return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));
  },[filtered]);

  const stats=useMemo(()=>({
    high:ALL.filter(x=>isHigh(x)).length,
    total:ALL.length,
    today:ALL.filter(x=>(x.date||'')===TODAY).length
  }),[]);

  const pickVendor=v=>{
    if(v===vendor){setVendor(null);return;}
    setVendor(v);setQ('');setHl(null);
    if(UP_V.includes(v))setTab('上游供应链');
    else if(v==='market')setTab('行业动态');
    else setTab('服务器厂商');
    window.scrollTo({top:0,behavior:'smooth'});
  };

  const openHot=kw=>{
    const a=matchArticle(kw);
    if(!a){setQ(kw.slice(0,12));return;}
    setVendor(null);setQ('');setChain('产业链全部');
    if(a.cat==='server')setTab('服务器厂商');else if(a.cat==='upstream')setTab('上游供应链');else if(a.cat==='demand')setTab('集采需求');else if(a.cat==='capital')setTab('资本市场');else if(a.cat==='policy')setTab('政策管制');else setTab('行业动态');
    setHl(a.id);
    setTimeout(()=>{
      const el=document.getElementById('card-'+a.id);
      if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
    },180);
    setTimeout(()=>setHl(null),2600);
  };

  const exportBrief=()=>{
    const today=ALL.filter(x=>(x.date||'')===TODAY);
    const items=(today.length?today:ALL.slice(0,10));
    let md='# 服务器行业情报简报 · '+TODAY+'\n\n';
    items.forEach((x,i)=>{
      md+=`## ${i+1}. ${x.title}\n- 厂商：${VN[x.vendor]||x.vendor} ｜ 来源：${x.source||''} ｜ 时间：${x.time||x.date||''}\n- 摘要：${(x.summary||'').slice(0,150)}\n`;
      if(x.analysis&&x.analysis.impact)md+=`- 影响：${x.analysis.impact}\n`;
      if(x.url)md+=`- 链接：${x.url}\n`;
      md+='\n';
    });
    md+='\n> by 服务器行业情报中心 · 识野Insight';
    if(navigator.clipboard) navigator.clipboard.writeText(md).then(()=>alert('简报 Markdown 已复制到剪贴板'));
  };

  const hotColor=i=>i===0?'bg-red-500 text-white':i===1?'bg-orange-400 text-white':i===2?'bg-amber-400 text-white':'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400';
  const segColor={violet:'bg-violet-100 text-violet-600 dark:bg-violet-950/60 dark:text-violet-400',
    blue:'bg-blue-100 text-blue-600 dark:bg-blue-950/60 dark:text-blue-400',
    emerald:'bg-emerald-100 text-emerald-600 dark:bg-emerald-950/60 dark:text-emerald-400'};

  const isTimeline=tab==='时间线';

  return <div className={`min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors`}>
    {/* Header */}
    <header className="sticky top-0 z-30 bg-white/85 dark:bg-slate-950/85 backdrop-blur border-b border-slate-200 dark:border-slate-800">
      <div className="max-w-[1440px] mx-auto px-6 h-16 flex items-center gap-5">
        <div className="flex items-center gap-3 shrink-0">
          <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2"><path d="M3 12l5-8 4 8 4-8 5 8-5 8-4-8-4 8-5-8z"/></svg>
          </div>
          <div className="leading-tight">
            <div className="font-bold text-[15px] tracking-wide">服务器行业情报中心</div>
            <div className="text-[11px] text-slate-400 tracking-wider">by 识野Insight</div>
          </div>
        </div>
        <div className="relative flex-1 max-w-xl text-slate-400">
          <div className="absolute left-3 top-1/2 -translate-y-1/2"><IconSearch/></div>
          <input ref={searchRef}
            className="w-full h-10 pl-9 pr-16 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/25 focus:border-blue-400 transition dark:bg-slate-900 dark:border-slate-800 dark:text-slate-100"
            placeholder="搜索厂商 / 事件 / 关键词…" value={q} onChange={e=>setQ(e.target.value)}/>
          <kbd className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 border border-slate-200 dark:border-slate-700 rounded px-1.5 py-0.5">/</kbd>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          {[ ['时间',time,setTime,['近7天','近30天','近90天','全部时间']],
             ['产业链',chain,setChain,['产业链全部','上游','中游','下游']] ].map(([label,v,setV,opts])=>(
            <div key={label} className="relative">
              <label className="absolute -top-2 left-3 bg-white dark:bg-slate-950 px-1 text-[10px] text-slate-400 z-10">{label}</label>
              <select className="h-10 pl-3 pr-8 rounded-xl border border-slate-200 bg-white text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500/25 cursor-pointer dark:bg-slate-900 dark:border-slate-800 dark:text-slate-200"
                value={v} onChange={e=>setV(e.target.value)}>
                {opts.map(o=><option key={o}>{o}</option>)}
              </select>
              <svg className="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          ))}
          <button onClick={()=>setDark(d=>!d)} title="切换明暗模式"
            className="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center justify-center text-slate-500 dark:text-amber-300 hover:border-blue-300 transition">
            {dark?<IconSun/>:<IconMoon/>}
          </button>
        </div>
      </div>
    </header>

    <main className="max-w-[1440px] mx-auto px-6 py-5 grid lg:grid-cols-[7fr_3fr] gap-6 items-start">
      {/* ====== 左侧 70% ====== */}
      <div className="space-y-3">
        {/* AI 摘要 */}
        <div className="rounded-xl border border-blue-200 dark:border-blue-900/60 bg-gradient-to-r from-blue-50 to-indigo-50 dark:from-blue-950/40 dark:to-indigo-950/40 p-4 fadein text-blue-600 dark:text-blue-400">
          <div className="flex items-center gap-2 mb-2">
            <IconAI/>
            <span className="text-sm font-semibold text-blue-800 dark:text-blue-300">AI 行业核心摘要</span>
            <div className="ml-auto flex items-center gap-2">
              <span className="text-[11px] text-blue-500 dark:text-blue-400">SIC · {TODAY}</span>
              <button onClick={exportBrief} className="text-[11px] px-2 py-0.5 rounded-lg bg-white/70 dark:bg-slate-800/70 border border-blue-200 dark:border-blue-900 text-blue-700 dark:text-blue-300 hover:bg-white transition">导出简报</button>
            </div>
          </div>
          <p className="text-[13px] leading-6 text-slate-700 dark:text-slate-300">
            共收录 <b>{stats.total}</b> 条行业信号，高优先级 <b>{stats.high}</b> 条、当日 <b>{stats.today}</b> 条（截至 {TODAY}）。
            近日重点：NVIDIA H200 对华出货解冻、中兴通讯算力占比 35.1%（服务器存储 +60%）、长江存储 IPO 受理 330 亿、大摩预警 Q3 成熟 DRAM 涨价 50%、超聚变 IPO 募资 80 亿。
          </p>
        </div>

        {/* Tabs + count inline */}
        <div className="flex items-center gap-3 flex-wrap">
          <div className="flex items-center justify-between bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
            {[['全部','全部'],['服务器厂商','服务器厂商'],['上游供应链','上游供应链'],['集采需求','集采需求'],['资本市场','资本市场'],['政策管制','政策管制'],['时间线','时间线']].map(([t,aria])=>(
              <button key={t} onClick={()=>{setTab(t);if(t!=='时间线')setVendor(null);setHl(null);}}
                className={`flex-1 px-4 py-2.5 text-[13px] font-medium transition whitespace-nowrap text-center
                  ${tab===t?'bg-blue-600 text-white':'text-slate-500 hover:text-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 dark:hover:text-slate-100'}`}>
                {aria}
              </button>
            ))}
          </div>
          {vendor&&<button onClick={()=>setVendor(null)}
            className="text-[12px] px-3 py-2 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-900 hover:opacity-80">
            {VN[vendor]} ✕
          </button>}
          <span className="text-xs text-slate-400 ml-auto whitespace-nowrap">{filtered.length} 条</span>
        </div>

        {/* 时间线视图 */}
        {isTimeline?(
          <div className="relative pl-6">
            <div className="absolute left-[7px] top-1 bottom-1 w-px bg-slate-200 dark:bg-slate-800"/>
            {timeline.map(([date,items])=>(
              <div key={date} className="relative mb-6 fadein">
                <div className="absolute -left-6 top-1 w-[15px] h-[15px] rounded-full border-[3px] border-blue-500 bg-white dark:bg-slate-950"/>
                <div className="text-sm font-bold text-blue-600 dark:text-blue-400 mb-2 tabular-nums">{date}
                  <span className="ml-2 text-[11px] font-normal text-slate-400">{items.length} 条</span></div>
                <div className="space-y-2">
                  {items.map(x=>(
                    <div key={x.id} onClick={()=>{setTab('全部');setHl(x.id);
                        setTimeout(()=>{const el=document.getElementById('card-'+x.id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},180);
                        setTimeout(()=>setHl(null),2600);}}
                      className="cursor-pointer bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg px-4 py-2.5 hover:border-blue-300 dark:hover:border-blue-800 hover:shadow-sm transition">
                      <div className="flex items-center gap-2 text-[11px] text-slate-400 mb-0.5">
                        {isHigh(x)&&<span className="text-red-500">●</span>}
                        <span className="text-blue-600 dark:text-blue-400 font-medium">{VN[x.vendor]||x.vendor}</span>
                        <span>·</span><span>{CATS[x.cat]||'行业动态'}</span>
                        <span className="ml-auto">{x.source||''}</span>
                      </div>
                      <div className="text-[13px] leading-5.5 text-slate-800 dark:text-slate-200 txt-clamp-2">{x.title}</div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        ):(
          <div className="space-y-2.5">
            {filtered.map(x=><CardItem key={x.id} x={x} savedOn={saved.includes(x.id)} toggleSave={toggleSave} hl={hl===x.id}/>)}
            {filtered.length===0&&<div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-10 text-center text-slate-400 text-sm">没有符合筛选条件的情报</div>}
          </div>
        )}
      </div>

      {/* ====== 右侧 30% ====== */}
      <aside className="space-y-4 sticky top-[88px] self-start max-h-[calc(100vh-104px)] overflow-auto pr-1">
        {/* 近日热点 */}
        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 shadow-sm">
          <div className="flex items-baseline justify-between mb-3">
            <div>
              <div className="text-2xl font-black leading-none">近日热点</div>
              <div className="text-[11px] text-slate-400 tracking-wider mt-1">点击定位到对应卡片</div>
            </div>
          </div>
          <div className="space-y-1">
            {HOT.slice(0,5).map((t,i)=>(
              <button key={i} onClick={()=>openHot(t.tag||t.kw||'')}
                className="w-full flex items-center gap-3 p-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800/60 transition text-left group">
                <span className={`w-6 h-6 rounded-md flex items-center justify-center text-[12px] font-bold shrink-0 ${hotColor(i)}`}>{i+1}</span>
                <span className="text-sm text-slate-700 dark:text-slate-300 leading-tight txt-clamp-2 flex-1 group-hover:text-blue-600 dark:group-hover:text-blue-400">{t.tag||t.kw||''}</span>
                <span className="text-[11px] text-slate-400 tabular-nums shrink-0">{t.heat||t.cnt||''}</span>
              </button>
            ))}
          </div>
        </div>

        {/* 产业地图（只显示有数据的厂商） */}
        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 shadow-sm">
          <div className="text-sm font-bold mb-1">产业地图</div>
          <div className="text-[11px] text-slate-400 mb-3">INDUSTRY MAP · 仅有信号的厂商</div>
          <div className="space-y-4">
            {Object.entries(MAP).map(([k,seg],si)=>(
              <div key={k}>
                <div className="flex items-center gap-2 mb-2">
                  <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${segColor[seg.color]}`}>{seg.label.split(' · ')[0]}</span>
                  <span className="text-[11px] text-slate-500 dark:text-slate-400">{seg.label.split(' · ')[1]}</span>
                </div>
                <div className="space-y-2.5 pl-1">
                  {seg.segs.map(sg=>(
                    <div key={sg.name}>
                      <div className="text-[10.5px] text-slate-400 mb-1 flex items-center gap-1">
                        <span className="w-1 h-1 rounded-full bg-slate-300 dark:bg-slate-600 inline-block"/>{sg.name}
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {sg.cat?
                          <button onClick={()=>{setQ(sg.q);setVendor(null);setTab(CATS[sg.cat]||'行业动态');}}
                            className="text-[11.5px] px-2.5 py-1 rounded-lg border bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-blue-400 hover:text-blue-600 dark:hover:text-blue-400">
                            查看相关 ⌕
                          </button>
                        :sg.vendors.map(v=>{
                          const n=ALL.filter(x=>x.vendor===v).length;
                          const on=vendor===v;
                          return <button key={v} onClick={()=>pickVendor(v)}
                            className={`text-[11.5px] px-2.5 py-1 rounded-lg border transition
                              ${on?'bg-blue-600 border-blue-600 text-white':'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-blue-400 hover:text-blue-600 dark:hover:text-blue-400'}`}>
                            {VN[v]}<span className={`ml-1 text-[10px] ${on?'text-blue-200':'text-slate-400'}`}>{n}</span>
                          </button>;
                        })}
                      </div>
                    </div>
                  ))}
                </div>
                {si<2&&<div className="mt-3 flex justify-center text-slate-300 dark:text-slate-700">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 4v14m0 0l-5-5m5 5l5-5"/></svg>
                </div>}
              </div>
            ))}
          </div>
          {/* 监控中 */}
          <div className="mt-4 pt-3.5 border-t border-slate-200 dark:border-slate-800">
            <div className="text-[10.5px] text-slate-400 mb-1.5">监控中 · 暂无信号</div>
            <div className="flex flex-wrap gap-1.5">
              {WATCH.map(w=><span key={w} title="监控中" className="text-[10.5px] px-2 py-0.5 rounded-md bg-slate-50 dark:bg-slate-800/60 text-slate-400">{w}</span>)}
            </div>
          </div>
        </div>

        {/* 信号统计 */}
        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 shadow-sm">
          <div className="text-sm font-bold mb-3">信号统计</div>
          <div className="grid grid-cols-3 gap-2 text-center">
            {[[stats.total,'全部信号','text-blue-600 dark:text-blue-400'],[stats.high,'高优先级','text-red-500'],[stats.today,'当日新增','text-emerald-500']].map(([n,l,c])=>(
              <div key={l} className="bg-slate-50 dark:bg-slate-800/60 rounded-lg py-2">
                <div className={`text-xl font-black tabular-nums ${c}`}>{n}</div>
                <div className="text-[10.5px] text-slate-400 mt-0.5">{l}</div>
              </div>
            ))}
          </div>
        </div>

        {/* 品牌 */}
        <div className="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-xl p-4 text-white text-xs leading-6">
          <div className="font-bold text-sm mb-1">识野Insight · 服务器行业情报中心</div>
          <div className="text-blue-100/90">数据来源于厂商官网 / 官方公众号 / 财报 / 政策发布 / 行业会议。由 AI 聚合分析，仅供参考。</div>
        </div>
      </aside>
    </main>

    {topBtn&&<button onClick={()=>window.scrollTo({top:0,behavior:'smooth'})}
      className="fixed bottom-6 right-6 z-40 w-10 h-10 rounded-xl bg-blue-600 text-white shadow-lg hover:bg-blue-700 transition flex items-center justify-center fadein" title="回到顶部">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M12 20V4m0 0l-6 6m6-6l6 6"/></svg>
    </button>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
